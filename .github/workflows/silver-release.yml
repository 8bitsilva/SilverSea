name: SilverSea Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Ensure tag matches app version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expected = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $expected"
          }

      - name: Build Windows setup
        run: npm run package:win

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-installer/SilverSea-Setup.exe
          generate_release_notes: true
