name: SilverSea Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Ensure tag matches app version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expected = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $expected"
          }

      - name: Build and publish Windows setup
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = node -p "require('./package.json').version"
          $notesPath = Join-Path $env:GITHUB_WORKSPACE ".github\release-notes\$tag.md"
          if (-not (Test-Path -LiteralPath $notesPath)) { throw "Release notes not found: $notesPath" }
          npm run build
          npx electron-builder --win nsis --x64 --publish always `
            "-c.releaseInfo.releaseName=SilverSea $version" `
            "-c.releaseInfo.releaseNotesFile=$notesPath"

      - name: Publish customer release notes
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = process.env.GITHUB_REF_NAME;
            const version = tag.replace(/^v/, '');
            const notesPath = `.github/release-notes/${tag}.md`;
            const notes = fs.readFileSync(notesPath, 'utf8');
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            });
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              name: `SilverSea ${version}`,
              body: notes,
            });
