name: SilverSea Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Ensure tag matches app version
        id: app-version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expected = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $expected"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build Windows setup
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notesPath = Join-Path $env:GITHUB_WORKSPACE ".github\release-notes\$tag.md"
          if (-not (Test-Path -LiteralPath $notesPath)) { throw "Release notes not found: $notesPath" }
          npm run build
          npx electron-builder --win nsis --x64 --publish never

      - name: Publish setup and customer release notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SilverSea ${{ steps.app-version.outputs.version }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: |
            release-installer/SilverSea-Setup.exe
            release-installer/latest.yml
            release-installer/SilverSea-Setup.exe.blockmap
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
