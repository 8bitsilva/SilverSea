name: SilverSea Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Ensure tag matches app version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expected = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $expected"
          }

      - name: Build Windows setup
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Finish release notes and update assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notesPath = Join-Path $env:GITHUB_WORKSPACE ".github\release-notes\$tag.md"
          if (-not (Test-Path -LiteralPath $notesPath)) { throw "Release notes not found: $notesPath" }
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $releaseUrl = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          $release = Invoke-RestMethod -Method Get -Uri $releaseUrl -Headers $headers
          $blockmapPath = Join-Path $env:GITHUB_WORKSPACE "release-installer\SilverSea-Setup.exe.blockmap"
          if ($release.assets.name -notcontains "SilverSea-Setup.exe.blockmap") {
            Invoke-RestMethod -Method Post -Uri "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($release.id)/assets?name=SilverSea-Setup.exe.blockmap" -Headers $headers -ContentType "application/octet-stream" -InFile $blockmapPath | Out-Null
          }
          $notes = Get-Content -LiteralPath $notesPath -Raw -Encoding utf8
          $payload = @{
            name = "SilverSea $($tag.TrimStart('v'))"
            body = $notes
            draft = $false
            prerelease = $false
            make_latest = "true"
          } | ConvertTo-Json -Depth 5
          Invoke-RestMethod -Method Patch -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases/$($release.id)" -Headers $headers -ContentType "application/vnd.github+json" -Body $payload | Out-Null
