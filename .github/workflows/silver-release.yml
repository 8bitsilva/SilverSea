name: SilverSea Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Ensure tag matches app version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expected = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $expected"
          }

      - name: Build Windows setup
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notesPath = Join-Path $env:GITHUB_WORKSPACE ".github\release-notes\$tag.md"
          if (-not (Test-Path -LiteralPath $notesPath)) { throw "Release notes not found: $notesPath" }
          npm run build
          npx electron-builder --win nsis --x64 --publish never

      - name: Publish setup and customer release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = node -p "require('./package.json').version"
          $notesPath = Join-Path $env:GITHUB_WORKSPACE ".github\release-notes\$tag.md"
          $setup = Join-Path $env:GITHUB_WORKSPACE "release-installer\SilverSea-Setup.exe"
          $latest = Join-Path $env:GITHUB_WORKSPACE "release-installer\latest.yml"
          $blockmap = Join-Path $env:GITHUB_WORKSPACE "release-installer\SilverSea-Setup.exe.blockmap"
          foreach ($asset in @($setup, $latest, $blockmap)) {
            if (-not (Test-Path -LiteralPath $asset)) { throw "Release asset not found: $asset" }
          }

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup $latest $blockmap --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not upload setup assets for $tag" }
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title "SilverSea $version" --notes-file $notesPath
          } else {
            gh release create $tag $setup $latest $blockmap --repo $env:GITHUB_REPOSITORY --title "SilverSea $version" --notes-file $notesPath
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the SilverSea release $tag" }
